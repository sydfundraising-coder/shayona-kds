<style>
  :root{ --navy:#15243b; --jain:#e23b2e; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#000;overflow:hidden;font-family:'Poppins','Segoe UI',system-ui,sans-serif}
  .stage{position:fixed;inset:0;background:#000}

  /* two stacked layers we cross-fade between */
  .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease}
  .slide.on{opacity:1}
  .slide .img{position:absolute;inset:0;background-size:cover;background-position:center;
     background-repeat:no-repeat;transform:scale(1.06);transition:transform 8s ease-out}
  .slide.on .img{transform:scale(1.14)}          /* gentle Ken-Burns zoom */
  .slide .vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#000}
  /* dark gradient so the caption is always readable */
  .slide::after{content:"";position:absolute;inset:0;pointer-events:none;
     background:linear-gradient(to top, rgba(0,0,0,.72) 0%, rgba(0,0,0,.15) 26%, rgba(0,0,0,0) 45%)}
  .slide.promo::after{display:none}   /* promos have no caption, so no darkening */

  .cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:7vh 6vw;color:#fff;
     display:flex;align-items:flex-end;justify-content:space-between;gap:4vw;
     opacity:0;transform:translateY(2vh);transition:opacity 1s ease .35s, transform 1s ease .35s}
  .cap.on{opacity:1;transform:none}
  .cap .nameWrap{min-width:0;max-width:62vw}
  .cap .kicker{display:block;font-family:'Poppins',sans-serif;font-weight:700;
     font-size:1.9vh;letter-spacing:.5vh;text-transform:uppercase;color:#ffd9a0;
     margin-bottom:1.2vh;text-shadow:0 2px 10px rgba(0,0,0,.6)}
  .cap .name{display:block;font-family:'Poppins','Segoe UI',system-ui,sans-serif;font-size:7.2vh;
     font-weight:700;line-height:1.04;letter-spacing:-.12vh;text-shadow:0 4px 22px rgba(0,0,0,.55);
     white-space:normal;overflow-wrap:anywhere}
  .cap .jain{color:#ff6f64;font-size:4vh;font-weight:700;margin-left:1vw}
  .cap .price{font-family:'Poppins',sans-serif;font-size:4.2vh;font-weight:700;
     color:#15243b;white-space:nowrap;background:linear-gradient(135deg,#ffd98a,#f2ac3c);
     width:19vh;height:19vh;border-radius:50%;flex:none;display:flex;align-items:center;
     justify-content:center;box-shadow:0 8px 26px rgba(0,0,0,.4);align-self:center}

  /* small logo badge top-left */
  .badge{position:absolute;top:3.5vh;left:3.5vw;z-index:3;height:9vh;opacity:.96;
     filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}

  .msg{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
     text-align:center;color:#fff;background:radial-gradient(120% 120% at 50% 0%,#1d3350,#0a1220);
     padding:8vw;font-size:3vh;font-weight:600;line-height:1.5}
  .msg small{display:block;margin-top:2vh;font-size:2vh;font-weight:500;color:#9fb0c8}
  .hidden{display:none!important}
  /* NEW seal badge (top-right) for items marked New */

     background-position:center;filter:drop-shadow(0 6px 16px rgba(0,0,0,.4))}
  .snew[hidden]{display:none}
  /* Join-us QR codes (top-left) on every slide — transparent, so only the small
     white QR tiles cover the photo (a QR needs its white square to scan). */
  .tgqr{position:absolute;top:3vh;left:3vw;z-index:4;background:transparent;padding:0;
     display:flex;flex-direction:column;align-items:center}
  .tgqr .qrow{display:flex;gap:2vh;align-items:flex-start}
  .tgqr .qcell{display:flex;flex-direction:column;align-items:center;gap:.7vh}
  .tgqr img{width:13vh;height:13vh;display:block;border-radius:.8vh;background:#fff;
     padding:.8vh;box-shadow:0 6px 20px rgba(0,0,0,.45)}
  .tgqr .qlbl{font-family:'Poppins',sans-serif;font-weight:800;font-size:1.75vh;letter-spacing:.03vh;
     text-shadow:0 0 3px rgba(0,0,0,.95),0 1px 2px rgba(0,0,0,1),0 2px 8px rgba(0,0,0,.7)}
  .tgqr .qlbl.tg{color:#7fd0f8}
  .tgqr .qlbl.wa{color:#57e79e}
  .tgqr .cap2{margin-top:1vh;font-family:'Poppins',sans-serif;font-weight:700;
     font-size:1.7vh;color:#fff;line-height:1.2;max-width:30vh;text-align:center;
     text-shadow:0 0 3px rgba(0,0,0,.95),0 1px 2px rgba(0,0,0,1),0 2px 8px rgba(0,0,0,.7)}
  .tgqr[hidden]{display:none}
  /* full-screen "we're closed" notice overlay */
  .notice{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
     text-align:center;padding:8vw;background:radial-gradient(120% 120% at 50% 0%,#1d3350,#0a1220);color:#fff}
  .notice[hidden]{display:none}
  .notice .nkicker{font-family:'Poppins',sans-serif;font-weight:700;font-size:2.4vh;letter-spacing:.7vh;
     text-transform:uppercase;color:#ffd9a0;margin-bottom:3vh}
  .notice .ntitle{font-family:'Poppins',sans-serif;font-weight:700;font-size:9vh;line-height:1.04;margin-bottom:3vh}
  .notice .nmsg{font-family:'Poppins',sans-serif;font-weight:500;font-size:3.6vh;line-height:1.4;
     color:#e7eef7;max-width:74vw;margin:0 auto;white-space:pre-line}
  .notice .nhours{margin-top:5vh;background:rgba(255,255,255,.08);border:1px solid rgba(255,217,160,.4);
     border-radius:1.4vh;padding:2.2vh 3vw;display:inline-block}
  .notice .nhours[hidden]{display:none}
  .notice .nhours .nh-h{font-family:'Poppins',sans-serif;font-weight:700;font-size:2.3vh;letter-spacing:.6vh;
     text-transform:uppercase;margin-bottom:1.2vh;color:#ffd9a0}
  .notice .nhours div{font-family:'Poppins',sans-serif;font-weight:500;font-size:3vh;line-height:1.5;color:#fff}

  <div class="cap" id="cap">
    <div class="nameWrap"><span class="kicker">Shayona Cafe</span><span class="name" id="capName"></span></div>
    <div class="price" id="capPrice"></div>
  </div>
</div>
<div class="msg hidden" id="msg"></div>
<div class="notice" id="notice" hidden>
  <div>
    <div class="nkicker">Shayona Cafe</div>
    <div class="ntitle" id="nTitle"></div>
    <div class="nmsg" id="nMsg"></div>
    <div class="nhours" id="nHours" hidden>
      <div class="nh-h">Opening Hours</div>
      <div>Monday &ndash; Saturday: 10:00AM to 7:45PM</div>
      <div>Sunday: 10:15AM to 1:45PM &amp; 3:30PM to 7:45PM</div>
    </div>
  </div>
</div>

<script>
const LOGO = ""; /* optional: a data-URI logo; left blank to keep it clean */
const HOLD_MS = 6000;      // seconds each photo stays
const RELOAD_MS = 15000;   // re-check availability every 15 seconds

function titleCase(s){return String(s).replace(/\w\S*/g,t=>t.charAt(0).toUpperCase()+t.slice(1).toLowerCase());}
function money(p){return p==null?'':'$'+Number(p).toFixed(2);}

let slides=[], idx=0, layer=0, timer=null, videoPlaying=false;
const els=[document.getElementById('s0'),document.getElementById('s1')];
const imgs=[els[0].querySelector('.img'),els[1].querySelector('.img')];
const vids=[els[0].querySelector('.vid'),els[1].querySelector('.vid')];
const cap=document.getElementById('cap'), capName=document.getElementById('capName'), capPrice=document.getElementById('capPrice');
const msg=document.getElementById('msg');

function showMessage(html){ msg.innerHTML=html; msg.classList.remove('hidden'); }
function hideMessage(){ msg.classList.add('hidden'); }

function preload(src){ return new Promise(res=>{ const i=new Image(); i.onload=()=>res(true); i.onerror=()=>res(false); i.src=src; }); }
function clearTimer(){ if(timer){ clearTimeout(timer); timer=null; } }
function scheduleAdvance(ms){ clearTimer(); timer=setTimeout(step, ms); }
function advance(){ videoPlaying=false; clearTimer(); step(); }

async function step(){
  if(!slides.length) return;
  // pick the next slide; skip broken IMAGES, but always try videos
  let s=null, ok=false, tries=0;
  while(tries < slides.length){
    s = slides[idx % slides.length];
    idx = (idx + 1) % slides.length;
    tries++;
    if(s.video){ ok=true; break; }
    ok = await preload(s.image);
    if(ok) break;
  }
  if(!ok){
    clearTimer();
    els[0].classList.remove('on'); els[1].classList.remove('on'); cap.classList.remove('on');
    showMessage("Photos couldn't be loaded."+
      "<small>Check this screen's internet connection, or add photos in KDS → Menu → Photos &amp; videos.</small>");
    return;
  }
  hideMessage();
  const next = 1 - layer;
  const imgEl=imgs[next], vidEl=vids[next];
  // reset this layer's media before showing the new slide
  try{ vidEl.pause(); }catch(_){}
  vidEl.onended=null; vidEl.onerror=null; vidEl.removeAttribute('src'); vidEl.load(); vidEl.style.display='none';
  imgEl.style.display='';
  // caption: dishes show name + price; promos show nothing
  els[next].classList.toggle('promo', !!s.promo);
  if(!s.promo){ capName.textContent=titleCase(s.name); capPrice.textContent=money(s.price); }
  const sn=document.getElementById('snew'); if(sn) sn.hidden = !s.isNew;

  if(s.video){
    imgEl.style.display='none'; vidEl.style.display='block';
    videoPlaying=true;
    vidEl.onended=()=>advance();
    vidEl.onerror=()=>advance();
    vidEl.src=s.image;
    try{ vidEl.currentTime=0; }catch(_){}
    const pr=vidEl.play();
    if(pr && pr.catch) pr.catch(()=>{ scheduleAdvance(HOLD_MS); }); // autoplay blocked → fall back to a timer
  }else{
    imgEl.style.backgroundImage = `url("${s.image}")`;
  }

  // pause the outgoing layer's video (if any) as it fades away
  try{ vids[layer].pause(); }catch(_){}
  els[next].classList.add('on');
  els[layer].classList.remove('on');
  cap.classList.toggle('on', !s.promo);
  layer = next;
  if(!s.video) scheduleAdvance(HOLD_MS);
}

async function load(){
  try{
    const r = await fetch('/api/slideshow',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data = await r.json();
    const fresh = (data.slides||[]);
    if(!fresh.length){
      clearTimer(); videoPlaying=false; slides=[];
      els[0].classList.remove('on'); els[1].classList.remove('on'); cap.classList.remove('on');
      if((data.availableItems||0)===0){
        showMessage("No items are available right now.");
      }else{
        showMessage("No photos to show yet."+
          "<small>Add photos or videos in <b>KDS → Menu → Photos &amp; videos</b>.</small>");
      }
      return;
    }
    hideMessage();
    slides = fresh;
    if(!timer && !videoPlaying){ idx=0; step(); }   // (re)start the loop only if idle
  }catch(e){
    // Only surface an error if we have nothing on screen yet.
    if(!slides.length){
      showMessage("Can't reach the menu."+"<small>Check this screen's internet connection. It will retry automatically.</small>");
    }
  }
}

if(LOGO){ const b=new Image(); b.className='badge'; b.src=LOGO; document.getElementById('stage').appendChild(b); }
// "We're closed" notice overlay — pushed from the control panel.
async function pollNotice(){
  try{
    const n=await fetch('/api/notice',{cache:'no-store'}).then(r=>r.json());
    const el=document.getElementById('notice');
    if(n&&n.active){
      document.getElementById('nTitle').textContent=n.title||'We are closed';
      document.getElementById('nMsg').textContent=n.message||'';
      document.getElementById('nHours').hidden = !n.hours;
      el.hidden=false;
    }else{ el.hidden=true; }
  }catch(e){}
}
pollNotice(); setInterval(pollNotice, 8000);
showMessage("Loading menu photos…");
load(); setInterval(load, RELOAD_MS);
</script>
