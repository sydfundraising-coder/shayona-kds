<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Shayona Cafe KDS</title>
<script>
  // Short addresses like /pizza or /window: open the KDS on that screen.
  var p = location.pathname.replace(/^\/+|\/+$/g, '');
  var tv = { 'menu-board':1, menuboard:1, tv:1, tvmenu:1, 'tv-menu':1 }, ss = { 'menu-slideshow':1, slideshow:1, photos:1 };
  var k = p.toLowerCase();
  if (tv[k]) location.replace('/menu-board.html');
  else if (ss[k]) location.replace('/menu-slideshow.html');
  else if (p && !/\./.test(p)) location.replace('/#/' + p); else location.replace('/');
</script></head>
<body style="font-family:system-ui;background:#0f1115;color:#f2f4f8;padding:40px">Opening Shayona Cafe KDS… <a href="/" style="color:#f59e0b">Go to home</a></body></html>
